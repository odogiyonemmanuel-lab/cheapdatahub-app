name: CheapDataHub Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply CheapDataHub branding
        run: |
          find src -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' \) -print0 | xargs -0 sed -i 's/SwiftVTU/CheapDataHub/g'

      - name: Add polished contact section to landing footer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/LandingPage.tsx')
          text = path.read_text()
          marker = '      </footer>'
          contact = '''

              <div className="mt-8 pt-7 border-t border-slate-800/80 text-center">
                <div className="inline-flex items-center gap-2 rounded-full border border-emerald-500/20 bg-emerald-500/10 px-3 py-1.5 text-xs font-semibold text-emerald-300">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" />
                  Need help?
                </div>
                <h3 className="mt-3 text-base font-bold text-white">Contact Us</h3>
                <p className="mt-1.5 text-sm text-slate-400">
                  Reach the CheapDataHub Admin for support and assistance.
                </p>
                <div className="mt-5 flex flex-col sm:flex-row items-center justify-center gap-3">
                  <a
                    href="mailto:dataodogiyonemmanuel@gmail.com"
                    className="w-full sm:w-auto inline-flex items-center justify-center rounded-xl border border-slate-700 bg-slate-900/80 px-5 py-3 text-sm font-semibold text-slate-200 hover:border-emerald-500/50 hover:bg-slate-900 hover:text-emerald-300 transition shadow-sm"
                  >
                    Email Us
                  </a>
                  <a
                    href="https://wa.me/2347031261521?text=Hello%20CheapDataHub%20Admin"
                    target="_blank"
                    rel="noreferrer"
                    className="w-full sm:w-auto inline-flex items-center justify-center rounded-xl bg-emerald-500 px-5 py-3 text-sm font-bold text-slate-950 hover:bg-emerald-400 transition shadow-lg shadow-emerald-500/10"
                  >
                    WhatsApp Admin
                  </a>
                </div>
                <p className="mt-3 text-xs text-slate-500">
                  07031261521 · dataodogiyonemmanuel@gmail.com
                </p>
              </div>'''
          if marker not in text:
              raise SystemExit('LandingPage footer marker not found')
          if 'Contact Us' in text:
              raise SystemExit('Contact section already exists in LandingPage source')
          path.write_text(text.replace(marker, contact + '\n' + marker, 1))
          PY

      - name: Generate SEO crawler files
        run: |
          mkdir -p public
          cat > public/robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://cheapdatahub.top/sitemap.xml
          EOF
          cat > public/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://cheapdatahub.top/</loc>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml

  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply CheapDataHub branding
        run: |
          find src -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' \) -print0 | xargs -0 sed -i 's/SwiftVTU/CheapDataHub/g'

      - name: Add polished contact section to landing footer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/LandingPage.tsx')
          text = path.read_text()
          marker = '      </footer>'
          contact = '''

              <div className="mt-8 pt-7 border-t border-slate-800/80 text-center">
                <div className="inline-flex items-center gap-2 rounded-full border border-emerald-500/20 bg-emerald-500/10 px-3 py-1.5 text-xs font-semibold text-emerald-300">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" />
                  Need help?
                </div>
                <h3 className="mt-3 text-base font-bold text-white">Contact Us</h3>
                <p className="mt-1.5 text-sm text-slate-400">
                  Reach the CheapDataHub Admin for support and assistance.
                </p>
                <div className="mt-5 flex flex-col sm:flex-row items-center justify-center gap-3">
                  <a
                    href="mailto:dataodogiyonemmanuel@gmail.com"
                    className="w-full sm:w-auto inline-flex items-center justify-center rounded-xl border border-slate-700 bg-slate-900/80 px-5 py-3 text-sm font-semibold text-slate-200 hover:border-emerald-500/50 hover:bg-slate-900 hover:text-emerald-300 transition shadow-sm"
                  >
                    Email Us
                  </a>
                  <a
                    href="https://wa.me/2347031261521?text=Hello%20CheapDataHub%20Admin"
                    target="_blank"
                    rel="noreferrer"
                    className="w-full sm:w-auto inline-flex items-center justify-center rounded-xl bg-emerald-500 px-5 py-3 text-sm font-bold text-slate-950 hover:bg-emerald-400 transition shadow-lg shadow-emerald-500/10"
                  >
                    WhatsApp Admin
                  </a>
                </div>
                <p className="mt-3 text-xs text-slate-500">
                  07031261521 · dataodogiyonemmanuel@gmail.com
                </p>
              </div>'''
          if marker not in text:
              raise SystemExit('LandingPage footer marker not found')
          if 'Contact Us' in text:
              raise SystemExit('Contact section already exists in LandingPage source')
          path.write_text(text.replace(marker, contact + '\n' + marker, 1))
          PY

      - name: Generate SEO crawler files
        run: |
          mkdir -p public
          cat > public/robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://cheapdatahub.top/sitemap.xml
          EOF
          cat > public/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://cheapdatahub.top/</loc>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        run: npx vercel --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}