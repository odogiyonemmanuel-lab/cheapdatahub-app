name: CheapDataHub Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply CheapDataHub branding
        run: |
          find src -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' \) -print0 | xargs -0 sed -i 's/SwiftVTU/CheapDataHub/g'

      - name: Generate SEO crawler files
        run: |
          mkdir -p public
          cat > public/robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://cheapdatahub.top/sitemap.xml
          EOF
          cat > public/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://cheapdatahub.top/</loc>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml

  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply CheapDataHub branding
        run: |
          find src -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' \) -print0 | xargs -0 sed -i 's/SwiftVTU/CheapDataHub/g'

      - name: Generate SEO crawler files
        run: |
          mkdir -p public
          cat > public/robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://cheapdatahub.top/sitemap.xml
          EOF
          cat > public/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://cheapdatahub.top/</loc>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        run: npx vercel --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
